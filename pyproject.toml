[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setppo"
version = "0.1.0"
description = "Manuscript-derived implementation of task-constrained secure semantic alignment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.10,<2", "scikit-learn>=1.4,<2", "torch>=2.2,<3"]

[project.optional-dependencies]
text = ["transformers>=4.38,<5", "safetensors>=0.4"]
plots = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
setppo = "setppo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

